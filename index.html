<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHA Hash Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      width: 90%;
      max-width: 800px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
    }

    textarea, select {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      background-color: #000;
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background-color: #333;
    }

    .output {
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      word-break: break-word;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>SHA Hash Generator</h2>

    <label for="inputText">Enter Text to Hash:</label>
    <textarea id="inputText" rows="6" placeholder="Type your text here..."></textarea>

    <label for="hashType">Choose Hash Algorithm:</label>
    <select id="hashType">
      <option value="SHA-1">SHA-1</option>
      <option value="SHA-256">SHA-256</option>
    </select>

    <button onclick="generateHash()">Generate Hash</button>

    <h3>Output:</h3>
    <div class="output" id="outputHash">Hash will appear here</div>
  </div>

  <script>
    async function generateHash() {
      const text = document.getElementById("inputText").value;
      const algorithm = document.getElementById("hashType").value;

      if (!text) {
        alert("Please enter some text!");
        return;
      }

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest(algorithm, data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        document.getElementById("outputHash").innerText = hashHex;
      } catch (err) {
        document.getElementById("outputHash").innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
